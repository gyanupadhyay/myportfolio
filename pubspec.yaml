name: myportfolio
description: "The Interactive Engineering Story — Gyan Upadhyay's portfolio."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.3

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/resume.pdf
    # Painted scene plates. Only the scenes built with `--dart-define=PLATES`
    # read these; see lib/world/plate.dart.
    - assets/art/
    # Synthesised by tool/generate_ambience.py. Fetched only when the visitor
    # turns ambience on, never as part of the initial load.
    - assets/audio/

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
